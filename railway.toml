[build]
builder = "NIXPACKS"
# Миграции НЕ на этапе сборки: сборка не должна менять прод-БД до того,
# как новая версия прошла healthcheck (иначе откат оставляет схему впереди кода).
buildCommand = "npm ci && npm run prisma:generate && npm run backend:build"

[deploy]
# Миграции перед стартом. Все файлы миграций идемпотентны (IF NOT EXISTS),
# поэтому цепочка безопасно накатывается и на базу, созданную через `db push`.
# Если миграция всё же упала — сервис поднимается с предупреждением в логах,
# чтобы ошибка схемы не превращалась в лежащий сайт.
startCommand = "sh -c 'npm run prisma:migrate || echo \"WARN: prisma migrate failed - starting anyway, check schema\"; npm run backend:start'"
# liveness, а не /health с SELECT 1: недоступность БД не должна рестартовать живой контейнер
healthcheckPath = "/health/live"
healthcheckTimeout = 100
restartPolicyType = "ON_FAILURE"
restartPolicyMaxRetries = 10
