[phases.setup]
nixPkgs = ["nodejs-22_x"]

[phases.install]
cmds = ["npm ci"]

# Миграции не на сборке: прод-БД не должна меняться до успешного healthcheck
[phases.build]
cmds = ["npm run prisma:generate", "npm run backend:build"]

[start]
cmd = "sh -c 'npm run prisma:migrate || echo \"WARN: prisma migrate failed - starting anyway, check schema\"; npm run backend:start'"
